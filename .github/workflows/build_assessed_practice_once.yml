name: Build Assessed Practice pages once

on:
  push:
    paths:
      - '.github/workflows/build_assessed_practice_once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build pages
        run: python tools/build_assessed_practice.py
      - name: Commit generated pages
        run: |
          rm -f .github/workflows/build_assessed_practice_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html Math146_Course_LMS.html assessed_practice .github/workflows/build_assessed_practice_once.yml
          git commit -m 'Convert weekly quizzes to Assessed Practice with direct URLs'
          git push
